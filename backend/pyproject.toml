[project]
name = "hotline-doc-backend"
version = "0.1.0"
description = "HoTLinE Doc - ระบบยื่นขอใบอนุญาตประกอบธุรกิจโรงแรมและที่พักแรม (Backend)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "python-multipart>=0.0.20",
    "pillow>=11.0",
    "httpx>=0.28",
]

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8.3", "httpx>=0.28"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# ตาราง อปท. จัดคอลัมน์ให้อ่านง่ายและตรวจทานกับโจทย์ได้เร็ว จึงยอมให้ยาวเกิน 100
"app/seeds/local_authorities.py" = ["E501"]

[tool.pytest.ini_options]
# ให้ pytest เห็นแพ็กเกจ app/ โดยไม่ต้องติดตั้งโปรเจกต์
pythonpath = ["."]
testpaths = ["tests"]
